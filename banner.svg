<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(20deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes scroll { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .container {
          width: 800px; height: 400px; background: #0d1117;
          font-family: 'Segoe UI', Roboto, sans-serif;
          display: flex; align-items: center; justify-content: center;
          position: relative; overflow: hidden; border-radius: 20px;
        }
        .glow {
          position: absolute; width: 300px; height: 300px;
          background: radial-gradient(circle, rgba(54, 188, 247, 0.2) 0%, transparent 70%);
          border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%);
          animation: pulse 4s infinite alternate;
        }
        .glass-box {
          background: rgba(255, 255, 255, 0.03);
          backdrop-filter: blur(15px);
          border: 1px solid rgba(54, 188, 247, 0.3);
          border-radius: 24px; padding: 40px;
          display: flex; align-items: center; gap: 40px;
          box-shadow: 0 20px 50px rgba(0,0,0,0.5);
          z-index: 10;
        }
        .laptop-wrap { position: relative; }
        .laptop {
          width: 160px; height: 100px; background: #21262d;
          border: 3px solid #36bcf7; border-radius: 10px;
          position: relative; overflow: hidden;
          animation: float 4s infinite ease-in-out;
        }
        .code-stream {
          padding: 8px; font-family: monospace; font-size: 7px;
          color: #36bcf7; animation: scroll 8s linear infinite;
        }
        .waver {
          font-size: 40px; position: absolute;
          bottom: -15px; right: -15px;
          animation: wave 2s infinite ease-in-out;
          transform-origin: 70% 70%;
        }
        .info h1 { font-size: 38px; color: #36bcf7; margin: 0; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .info p { font-size: 18px; color: #8b949e; margin: 10px 0; font-weight: 400; }
        .tech-tags { color: #58a6ff; font-family: monospace; font-size: 13px; margin-top: 15px; border-left: 2px solid #36bcf7; padding-left: 15px; }
      </style>
      <div class="container">
        <div class="glow"></div>
        <div class="glass-box">
          <div class="laptop-wrap">
            <div class="laptop">
              <div class="code-stream">
                class Developer {<br/>
                &nbsp;&nbsp;constructor() {<br/>
                &nbsp;&nbsp;&nbsp;&nbsp;this.name = "Harsh";<br/>
                &nbsp;&nbsp;&nbsp;&nbsp;this.aim = "Insights";<br/>
                &nbsp;&nbsp;}<br/>
                &nbsp;&nbsp;analyze(data) {<br/>
                &nbsp;&nbsp;&nbsp;&nbsp;return solve(data);<br/>
                &nbsp;&nbsp;}<br/>
                }<br/>
                while(true) {<br/>
                &nbsp;&nbsp;code(); learn();<br/>
                &nbsp;&nbsp;build(); repeat();<br/>
                }
              </div>
            </div>
            <div class="waver">👋</div>
          </div>
          <div class="info">
            <h1>Harsh Sharma</h1>
            <p>Software Developer | Data Analyst</p>
            <div class="tech-tags">
              JAVA • PYTHON • REACT • DJANGO<br/>
              NODE.JS • DATA ANALYTICS • SQL
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
